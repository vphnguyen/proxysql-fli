# =============================================================================
# fli-proxysql values.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# CORE: StatefulSet "proxysql-core" -> pod proxysql-core-0, proxysql-core-1, ...
# Bắt buộc mỗi pod nằm trên 1 node riêng (hard pod anti-affinity), tối thiểu 3 pod/3 node.
# -----------------------------------------------------------------------------



core:
  name: proxysql-core
  replicaCount: 3          # >= 3, mỗi pod sẽ được scheduler ép lên 1 node khác nhau
  podManagementPolicy: Parallel
  
  image:
    repository: proxysql/proxysql
    tag: "2.5.5"
    pullPolicy: IfNotPresent

  service:
    headlessService: enabled   # nếu enabled = true thì sinh ra 1 Service bình thường (ClusterIP/NodePort/LoadBalancer)
    type: ClusterIP
    ports:
      rw: 3306
      ro: 3307
      admin: 6032
    nodePorts:            # chỉ áp dụng nếu service.type = NodePort
      rw: ""
      ro: ""
      admin: ""

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: ""       # để trống dùng storageClass mặc định của cluster

  nodeSelector: {}
  tolerations: []
  nodeAffinity: {}          # có thể set thêm preferred/required nodeAffinity nếu cần
  serviceAccountName: ""
  terminationGracePeriodSeconds: 30
  podAnnotations: {}

  # Nội dung /etc/proxysql.cnf tuỳ chỉnh (để trống = dùng config mặc định của image)
  config: |
    admin_variables=
    {
        admin_credentials="admin:adminFliPa55w0rd;cluster_fli_b2b:secret_fli_b2b"
        mysql_ifaces="0.0.0.0:6032"
        refresh_interval=2000
        cluster_username="cluster_fli_b2b"
        cluster_password="secret_fli_b2b"
    }
    mysql_variables=
    {
        threads=4
        max_connections=2048
        default_query_delay=0
        default_query_timeout=36000000
        have_compress=true
        poll_timeout=2000
        interfaces="0.0.0.0:3306;0.0.0.0:3307/tmp/proxysql.sock"
        default_schema="information_schema"
        stacksize=1048576
        server_version="8.0.23"
        connect_timeout_server=3000
        monitor_username="proxy_monitor"
        monitor_password="Proxymonitor"
        monitor_history=600000
        monitor_connect_interval=60000
        monitor_ping_interval=10000
        monitor_read_only_interval=1500
        monitor_read_only_timeout=500
        ping_interval_server_msec=120000
        ping_timeout_server=500
        commands_stats=true
        sessions_sort=true
        connect_retries_on_failure=10
    }
    mysql_servers =
    (
      { address="fli-proxysql-mysqllab-service" , port=3306 , hostgroup=1, max_connections=100 },      
    )
    mysql_users =
    (
      { username = "root", password = "rootpassword", default_hostgroup = 1, active = 1 }
    )
    mysql_query_rules:
    (
          {
                  rule_id=1
                  active=1
                  proxy_port=3306
                  destination_hostgroup=1
                  apply=1
          },
          {
                  rule_id=2
                  active=1
                  proxy_port=3307
                  destination_hostgroup=2
                  apply=1
          }
    )


  livenessProbe: {}
  # ví dụ:
  # livenessProbe:
  #   tcpSocket:
  #     port: 6032
  #   initialDelaySeconds: 10
  #   periodSeconds: 10

  readinessProbe: {}

  # PodDisruptionBudget đảm bảo không mất quá nhiều pod cùng lúc khi drain node
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# -----------------------------------------------------------------------------
# SATELLITE: mỗi phần tử trong `environments` sinh ra 1 workload (STS hoặc DS)
# tên "proxysql-satellite-<env.name>" + 1 Service riêng "proxysql-satellite-<env.name>"
# -----------------------------------------------------------------------------
satellite:

  environments:
    - name: uat
      kind: StatefulSet
      headlessService: false
      replicaCount: 2        # chỉ dùng khi kind=StatefulSet
      image:
        repository: proxysql/proxysql
        tag: "2.5.5"
        pullPolicy: IfNotPresent
      service:
        type: ClusterIP
        ports:
          rw: 3306
          ro: 3307
          admin: 6032
        nodePorts:
          rw: ""
          ro: ""
          admin: ""
      resources:
        requests:
          cpu: 1
          memory: 1Gi
        limits:
          cpu: 4
          memory: 5Gi
      persistence:            # chỉ dùng khi kind=StatefulSet
        enabled: false
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ""
      nodeSelector: {}
      tolerations: []
      hostPath: ""             # chỉ dùng khi kind=DaemonSet và muốn ghi data ra host
      config: |
        admin_variables=
        {
            admin_credentials="admin:adminFliPa55w0rd;cluster_fli_b2b:secret_fli_b2b"
            mysql_ifaces="0.0.0.0:6032"
            refresh_interval=2000
            cluster_username="cluster_fli_b2b"
            cluster_password="secret_fli_b2b"
        }
        mysql_variables=
        {
            threads=4
            max_connections=2048
            default_query_delay=0
            default_query_timeout=36000000
            have_compress=true
            poll_timeout=2000
            interfaces="0.0.0.0:3306;0.0.0.0:3307/tmp/proxysql.sock"
            default_schema="information_schema"
            stacksize=1048576
            server_version="8.0.23"
            connect_timeout_server=3000
            monitor_username="proxy_monitor"
            monitor_password="Proxymonitor"
            monitor_history=600000
            monitor_connect_interval=60000
            monitor_ping_interval=10000
            monitor_read_only_interval=1500
            monitor_read_only_timeout=500
            ping_interval_server_msec=120000
            ping_timeout_server=500
            commands_stats=true
            sessions_sort=true
            connect_retries_on_failure=10
        }

    - name: production
      kind: DaemonSet     
      #replicaCount: 3
      image:
        repository: proxysql/proxysql
        tag: "2.5.5"
        pullPolicy: IfNotPresent
      service:
        type: ClusterIP
        ports:
          rw: 3308
          ro: 3307
          admin: 6032
        nodePorts:
          rw: ""
          ro: ""
          admin: ""
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      persistence:
        enabled: false
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ""
      nodeSelector: {}
      tolerations: []
      hostPath: ""
      config: ""


