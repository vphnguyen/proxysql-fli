{{- range $env := .Values.satellite.environments }}
{{- if eq $env.kind "DaemonSet" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: proxysql-satellite-{{ $env.name }}
  labels:
    app: proxysql
    component: satellite
    environment: {{ $env.name }}
    {{- include "fli-proxysql.labels" $ | nindent 4 }}
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: proxysql
      component: satellite
      environment: {{ $env.name }}
  template:
    metadata:
      labels:
        app: proxysql
        component: satellite
        environment: {{ $env.name }}
    spec:
      {{- if $env.nodeSelector }}
      nodeSelector:
        {{- toYaml $env.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $env.tolerations }}
      tolerations:
        {{- toYaml $env.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: proxysql
          image: "{{ $env.image.repository }}:{{ $env.image.tag }}"
          imagePullPolicy: {{ $env.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: proxysql-rw
              containerPort: {{ $env.service.ports.rw }}
            - name: proxysql-ro
              containerPort: {{ $env.service.ports.ro }}
            - name: proxysql-admin
              containerPort: {{ $env.service.ports.admin }}
          {{- if $env.resources }}
          resources:
            {{- toYaml $env.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/proxysql
            {{- if $env.config }}
            - name: config
              mountPath: /etc/proxysql.cnf
              subPath: proxysql.cnf
            {{- end }}
      volumes:
        {{- if $env.config }}
        - name: config
          configMap:
            name: proxysql-satellite-{{ $env.name }}-config
        {{- end }}
        # DaemonSet không hỗ trợ volumeClaimTemplates -> dùng hostPath (nếu khai báo) hoặc emptyDir
        - name: data
          {{- if $env.hostPath }}
          hostPath:
            path: {{ $env.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
{{- end }}
