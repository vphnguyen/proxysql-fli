apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.core.name }}-headless
  labels:
    app: proxysql
    component: core
    {{- include "fli-proxysql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: proxysql-rw
      port: {{ .Values.core.service.ports.rw }}
      targetPort: {{ .Values.core.service.ports.rw }}
      protocol: TCP
    - name: proxysql-ro
      port: {{ .Values.core.service.ports.ro }}
      targetPort: {{ .Values.core.service.ports.ro }}
      protocol: TCP
    - name: proxysql-admin
      port: {{ .Values.core.service.ports.admin }}
      targetPort: {{ .Values.core.service.ports.admin }}
      protocol: TCP
  selector:
    app: proxysql
    component: core
