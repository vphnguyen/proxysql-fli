{{- if .Values.lab.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysqllab-service
  labels:
    app: mysql
    component: test
spec:
  type: {{ .Values.core.service.type }}
  ports:
    - name: mysql 
      port: 3306
      protocol: TCP
      targetPort: 3306
  selector:
    app: mysql
    component: test
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-mysql-lab
  labels:
    app: mysql
    component: test
spec:
  containers:
    - name: mysql
      image: mysql:8.0
      ports:
        - containerPort: 3306
          name: mysql

      env:
        - name: MYSQL_ROOT_PASSWORD
          value: {{ .Values.lab.rootPassword }}

      command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Starting MySQL..."

          docker-entrypoint.sh mysqld &
          MYSQL_PID=$!

          echo "Waiting for MySQL to be ready..."

          until mysqladmin ping \
            -h 127.0.0.1 \
            -uroot \
            -p{{ .Values.lab.rootPassword }} \
            --silent; do
            sleep 2
          done

          echo "MySQL is ready"

          mysql -uroot -prootpassword <<'EOF'

          CREATE DATABASE IF NOT EXISTS testdb;
          CREATE USER "tester"@"%" IDENTIFIED BY "abcdefgh";
          GRANT All PRIVILEGES ON testdb.* TO "tester"@"%";
          FLUSH PRIVILEGES;
          USE testdb;

          CREATE TABLE IF NOT EXISTS test_table (
              id INT AUTO_INCREMENT PRIMARY KEY,
              data DATETIME NOT NULL
          );

          INSERT INTO test_table (data) VALUES
              (NOW()),
              (NOW()),
              (NOW()),
              (NOW()),
              (NOW()),
              (NOW()),
              (NOW()),
              (NOW()),
              (NOW()),
              (NOW());

          EOF

          echo "Database initialized:"
          mysql -uroot -prootpassword -e \
            "SELECT * FROM testdb.test_table;"

          wait $MYSQL_PID

{{- end }}