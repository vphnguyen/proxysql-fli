{{- if .Values.core.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.core.name }}-config
  labels:
    app: proxysql
    component: core
    {{- include "fli-proxysql.labels" . | nindent 4 }}
data:
  proxysql.cnf: |
{{ .Values.core.config | indent 4 }}
 proxysql_servers =
    (
{{- range $i := until (int .Values.core.replicas) }}
        { hostname = "{{ $.Release.Name }}-core-{{ $i }}.{{ $.Release.Name }}-core", port = 6032, weight = 1000 }{{ if ne $i (sub (int $.Values.core.replicas) 1) }},{{ end }}
{{- end }}
    )

{{- end }}
